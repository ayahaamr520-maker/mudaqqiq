name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_URL: https://ayahaamr520-maker.github.io/mudaqqiq

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      # The three ONNX models (135-185 MB each) are too big for git, so they are
      # rebuilt from the original Hugging Face models and cached between runs.
      - name: Restore AI models from cache
        id: models
        uses: actions/cache@v4
        with:
          path: |
            web/models/arabic-punctuation/onnx
            web/models/arabic-spelling/onnx
            web/models/arabic-context/onnx
          key: onnx-models-${{ hashFiles('tools/export_onnx.py') }}

      - uses: actions/setup-python@v5
        if: steps.models.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: Build AI models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers<5" onnx onnxruntime onnxscript
          python tools/export_onnx.py

      - name: Point the Word add-in at the website
        run: node tools/configure-public.mjs --site "$SITE_URL"

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html .nojekyll web engine eval word-addin _site/
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
