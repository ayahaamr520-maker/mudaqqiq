        enticement: { label: "\u0625\u063A\u0631\u0627\u0621", mark: "!", why: "\xAB{t}\xBB \u0623\u0633\u0644\u0648\u0628 \u0625\u063A\u0631\u0627\u0621: \u062D\u062B\u0651 \u0627\u0644\u0645\u062E\u0627\u0637\u064E\u0628 \u0639\u0644\u0649 \u0623\u0645\u0631 \u0645\u062D\u0645\u0648\u062F\u060C \u0648\u064A\u0643\u062B\u0631 \u0623\u0646 \u064A\u0646\u062A\u0647\u064A \u0628\u0639\u0644\u0627\u0645\u0629 \u0627\u0644\u062A\u0639\u062C\u0628 (!) \u0644\u0645\u0627 \u0641\u064A\u0647 \u0645\u0646 \u0627\u0646\u0641\u0639\u0627\u0644.", def: "\u062A\u0646\u0628\u064A\u0647 \u0627\u0644\u0645\u062E\u0627\u0637\u064E\u0628 \u0639\u0644\u0649 \u0623\u0645\u0631 \u0645\u062D\u0645\u0648\u062F \u0644\u064A\u0641\u0639\u0644\u0647\u060C \u0628\u0630\u0643\u0631 \u0627\u0644\u0627\u0633\u0645 \u0645\u0646\u0635\u0648\u0628\u064B\u0627 \u0645\u0643\u0631\u0631\u064B\u0627 \u0623\u0648 \u0645\u0639\u0637\u0648\u0641\u064B\u0627: \u0627\u0644\u0635\u062F\u0642\u064E \u0627\u0644\u0635\u062F\u0642\u064E.", example: "\u0627\u0644\u0627\u062C\u062A\u0647\u0627\u062F\u064E \u0627\u0644\u0627\u062C\u062A\u0647\u0627\u062F\u064E!" },
        warning: { label: "\u062A\u062D\u0630\u064A\u0631", mark: "!", why: "\xAB{t}\xBB \u0623\u0633\u0644\u0648\u0628 \u062A\u062D\u0630\u064A\u0631: \u062A\u0646\u0628\u064A\u0647 \u0627\u0644\u0645\u062E\u0627\u0637\u064E\u0628 \u0639\u0644\u0649 \u0623\u0645\u0631 \u0645\u0643\u0631\u0648\u0647 \u0644\u064A\u062C\u062A\u0646\u0628\u0647\u060C \u0648\u064A\u0643\u062B\u0631 \u0623\u0646 \u064A\u0646\u062A\u0647\u064A \u0628\u0639\u0644\u0627\u0645\u0629 \u0627\u0644\u062A\u0639\u062C\u0628 (!).", def: "\u062A\u0646\u0628\u064A\u0647 \u0627\u0644\u0645\u062E\u0627\u0637\u064E\u0628 \u0639\u0644\u0649 \u0623\u0645\u0631 \u0645\u0643\u0631\u0648\u0647 \u0644\u064A\u062C\u062A\u0646\u0628\u0647\u060C \u0628\u0640\xAB\u0625\u064A\u0627\u0643\xBB \u0623\u0648 \u0628\u062A\u0643\u0631\u0627\u0631 \u0627\u0644\u0627\u0633\u0645 \u0627\u0644\u0645\u062D\u0630\u064E\u0651\u0631 \u0645\u0646\u0647 \u0623\u0648 \u0639\u0637\u0641\u0647.", example: "\u0625\u064A\u0627\u0643 \u0648\u0627\u0644\u0643\u0630\u0628\u064E!" },
        emphasis: { label: "\u062A\u0648\u0643\u064A\u062F", mark: ".", why: "\xAB{t}\xBB \u0645\u0646 \u0623\u062F\u0648\u0627\u062A \u0627\u0644\u062A\u0648\u0643\u064A\u062F\u061B \u0648\u0627\u0644\u062A\u0648\u0643\u064A\u062F \u062A\u0642\u0648\u064A\u0629 \u0627\u0644\u0645\u0639\u0646\u0649 \u0648\u062A\u062B\u0628\u064A\u062A\u0647 \u0641\u064A \u0646\u0641\u0633 \u0627\u0644\u0633\u0627\u0645\u0639.", def: "\u062A\u0642\u0648\u064A\u0629 \u0627\u0644\u0645\u0639\u0646\u0649 \u0648\u062A\u062B\u0628\u064A\u062A\u0647: \u0628\u0625\u0646\u0651 \u0648\u0623\u0646\u0651\u060C \u0648\u0644\u0642\u062F \u0648\u0642\u062F \u0645\u0639 \u0627\u0644\u0645\u0627\u0636\u064A\u060C \u0648\u0646\u0648\u0646 \u0627\u0644\u062A\u0648\u0643\u064A\u062F\u060C \u0648\u0627\u0644\u062A\u0648\u0643\u064A\u062F \u0627\u0644\u0645\u0639\u0646\u0648\u064A (\u0646\u0641\u0633\u060C \u0639\u064A\u0646\u060C \u0643\u0644\u060C \u062C\u0645\u064A\u0639)\u060C \u0648\u0627\u0644\u062A\u0648\u0643\u064A\u062F \u0627\u0644\u0644\u0641\u0638\u064A \u0628\u062A\u0643\u0631\u0627\u0631 \u0627\u0644\u0644\u0641\u0638.", example: "\u0625\u0646\u064E\u0651 \u0627\u0644\u0639\u0644\u0645\u064E \u0646\u0648\u0631\u064C." },
        oath: { label: "\u0642\u0633\u0645", mark: ".", why: "\xAB{t}\xBB \u0623\u0633\u0644\u0648\u0628 \u0642\u0633\u0645: \u062D\u0644\u0641 \u0644\u062A\u0648\u0643\u064A\u062F \u0627\u0644\u0643\u0644\u0627\u0645\u060C \u0648\u064A\u062D\u062A\u0627\u062C \u0625\u0644\u0649 \u062C\u0648\u0627\u0628.", def: "\u062A\u0648\u0643\u064A\u062F \u0627\u0644\u0643\u0644\u0627\u0645 \u0628\u0627\u0644\u062D\u0644\u0641 \u0628\u0623\u062D\u0631\u0641 \u0627\u0644\u0642\u0633\u0645 (\u0627\u0644\u0648\u0627\u0648\u060C \u0627\u0644\u0628\u0627\u0621\u060C \u0627\u0644\u062A\u0627\u0621) \u0623\u0648 \u0628\u0641\u0639\u0644 \u0627\u0644\u0642\u0633\u0645 (\u0623\u0642\u0633\u0645\u060C \u0623\u062D\u0644\u0641).", example: "\u0648\u0627\u0644\u0644\u0647\u0650 \u0644\u0623\u062C\u062A\u0647\u062F\u0646\u064E\u0651." },
        lament: { label: "\u0646\u062F\u0628\u0629", mark: "!", why: "\xAB{t}\xBB \u0623\u0633\u0644\u0648\u0628 \u0646\u062F\u0628\u0629: \u0646\u062F\u0627\u0621 \u0627\u0644\u0645\u062A\u0641\u062C\u064E\u0651\u0639 \u0639\u0644\u064A\u0647 \u0623\u0648 \u0627\u0644\u0645\u062A\u0648\u062C\u064E\u0651\u0639 \u0645\u0646\u0647 \u0628\u0640\xAB\u0648\u0627\xBB\u060C \u0648\u064A\u0646\u062A\u0647\u064A \u0628\u0639\u0644\u0627\u0645\u0629 \u0627\u0644\u062A\u0639\u062C\u0628 (!).", def: "\u0646\u062F\u0627\u0621 \u0627\u0644\u0645\u062A\u0641\u062C\u064E\u0651\u0639 \u0639\u0644\u064A\u0647 \u0623\u0648 \u0627\u0644\u0645\u062A\u0648\u062C\u064E\u0651\u0639 \u0645\u0646\u0647 \u0628\u0627\u0644\u062D\u0631\u0641 \xAB\u0648\u0627\xBB\u060C \u0648\u062A\u0644\u062D\u0642\u0647 \u063A\u0627\u0644\u0628\u064B\u0627 \u0623\u0644\u0641 \u0648\u0647\u0627\u0621: \u0648\u0627\u0645\u0639\u062A\u0635\u0645\u0627\u0647!", example: "\u0648\u0627\u0645\u0639\u062A\u0635\u0645\u0627\u0647!" },
        restriction: { label: "\u062A\u062E\u0635\u064A\u0635 (\u0642\u0635\u0631)", mark: ".", why: "\xAB{t}\xBB \u0623\u0633\u0644\u0648\u0628 \u0642\u0635\u0631 (\u062A\u062E\u0635\u064A\u0635): \u0625\u062B\u0628\u0627\u062A \u0627\u0644\u062D\u0643\u0645 \u0644\u0634\u064A\u0621 \u0648\u0646\u0641\u064A\u0647 \u0639\u0645\u0651\u0627 \u0639\u062F\u0627\u0647.", def: "\u062A\u062E\u0635\u064A\u0635 \u0623\u0645\u0631 \u0628\u0623\u0645\u0631 \u0628\u0637\u0631\u064A\u0642\u0629 \u0645\u062E\u0635\u0648\u0635\u0629: \u0628\u0640\xAB\u0625\u0646\u0645\u0627\xBB\u060C \u0623\u0648 \u0628\u0627\u0644\u0646\u0641\u064A \u0648\u0627\u0644\u0627\u0633\u062A\u062B\u0646\u0627\u0621 (\u0645\u0627\u2026 \u0625\u0644\u0627)\u060C \u0623\u0648 \u0628\u062A\u0642\u062F\u064A\u0645 \u0645\u0627 \u062D\u0642\u0647 \u0627\u0644\u062A\u0623\u062E\u064A\u0631.", example: "\u0625\u0646\u0645\u0627 \u064A\u062E\u0634\u0649 \u0627\u0644\u0644\u0647\u064E \u0627\u0644\u0639\u0644\u0645\u0627\u0621\u064F." },
        exception: { label: "\u0627\u0633\u062A\u062B\u0646\u0627\u0621", mark: ".", why: "\xAB{t}\xBB \u0623\u062F\u0627\u0629 \u0627\u0633\u062A\u062B\u0646\u0627\u0621: \u0625\u062E\u0631\u0627\u062C \u0645\u0627 \u0628\u0639\u062F\u0647\u0627 \u0645\u0646 \u062D\u0643\u0645 \u0645\u0627 \u0642\u0628\u0644\u0647\u0627.", def: "\u0625\u062E\u0631\u0627\u062C \u0645\u0627 \u0628\u0639\u062F \u0623\u062F\u0627\u0629 \u0627\u0644\u0627\u0633\u062A\u062B\u0646\u0627\u0621 \u0645\u0646 \u062D\u0643\u0645 \u0645\u0627 \u0642\u0628\u0644\u0647\u0627\u060C \u0628\u0623\u062F\u0648\u0627\u062A \u0645\u062B\u0644: \u0625\u0644\u0627\u060C \u063A\u064A\u0631\u060C \u0633\u0648\u0649\u060C \u0639\u062F\u0627\u060C \u062E\u0644\u0627\u060C \u062D\u0627\u0634\u0627.", example: "\u0646\u062C\u062D \u0627\u0644\u0637\u0644\u0627\u0628\u064F \u0625\u0644\u0627 \u062E\u0627\u0644\u062F\u064B\u0627." },
        appeal: { label: "\u0627\u0633\u062A\u063A\u0627\u062B\u0629", mark: "!", why: "\xAB{t}\xBB \u0623\u0633\u0644\u0648\u0628 \u0627\u0633\u062A\u063A\u0627\u062B\u0629: \u0646\u062F\u0627\u0621 \u0645\u0646 \u064A\u064F\u062E\u0644\u0650\u0651\u0635 \u0645\u0646 \u0634\u062F\u0651\u0629\u060C \u0648\u064A\u0646\u062A\u0647\u064A \u0628\u0639\u0644\u0627\u0645\u0629 \u0627\u0644\u062A\u0639\u062C\u0628 (!).", def: "\u0646\u062F\u0627\u0621 \u0645\u0646 \u064A\u064F\u062E\u0644\u0650\u0651\u0635 \u0645\u0646 \u0634\u062F\u0651\u0629 \u0623\u0648 \u064A\u064F\u0639\u064A\u0646 \u0639\u0644\u0649 \u062F\u0641\u0639\u0647\u0627\u060C \u0628\u0640\xAB\u064A\u0627\xBB \u0648\u0627\u0644\u0644\u0627\u0645 \u0627\u0644\u0645\u0641\u062A\u0648\u062D\u0629 \u0645\u0639 \u0627\u0644\u0645\u0633\u062A\u063A\u0627\u062B \u0628\u0647 \u0648\u0627\u0644\u0645\u0643\u0633\u0648\u0631\u0629 \u0645\u0639 \u0627\u0644\u0645\u0633\u062A\u063A\u0627\u062B \u0644\u0647.", example: "\u064A\u0627 \u0644\u064E\u0644\u0639\u0644\u0645\u0627\u0621\u0650 \u0644\u0650\u0644\u062C\u0647\u0644\u0627\u0621!" },
        hope: { label: "\u062A\u0631\u062C\u064D\u0651", mark: ".", why: "\xAB{t}\xBB \u0623\u062F\u0627\u0629 \u062A\u0631\u062C\u064D\u0651: \u0637\u0644\u0628 \u0623\u0645\u0631 \u0645\u062D\u0628\u0648\u0628 \u0645\u0645\u0643\u0646 \u0627\u0644\u062D\u0635\u0648\u0644.", def: "\u0637\u0644\u0628 \u0623\u0645\u0631 \u0645\u062D\u0628\u0648\u0628 \u0642\u0631\u064A\u0628 \u0627\u0644\u062D\u0635\u0648\u0644\u060C \u0628\u0640\xAB\u0644\u0639\u0644\u0651\xBB \u0648\xAB\u0639\u0633\u0649\xBB.", example: "\u0644\u0639\u0644\u064E\u0651 \u0627\u0644\u0641\u0631\u062C\u064E \u0642\u0631\u064A\u0628\u064C." },
