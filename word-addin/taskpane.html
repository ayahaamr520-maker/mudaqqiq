<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مُدقِّق</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="../web/styles.css">
  <style>
    body { font-size: 14px; }
    .pane { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .pane .head { display: flex; align-items: center; gap: 10px; }
    .pane .head h1 { font-size: 18px; margin: 0; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
    .note { font-size: 12.5px; color: var(--ink-3); }
    .section-title { font-size: 12.5px; color: var(--ink-3); margin: 4px 0 -2px; }
    .card .para { font-size: 12px; color: var(--ink-3); }
    .diff { font-size: 16px; }
  </style>
</head>
<body>
  <div class="pane">
    <div class="head"><span class="logo" aria-hidden="true">م</span><div><h1>مُدقِّق</h1><div class="note">الترقيم · الأساليب · النحو</div></div></div>
    <div class="row">
      <button id="check" class="btn primary">فحص المستند</button>
      <button id="fix-all" class="btn" disabled>تصحيح الكل</button>
    </div>
    <div class="row">
      <label class="switch"><input type="checkbox" id="live" checked> فحص الفقرة الحالية أثناء الكتابة</label>
      <label class="switch"><input type="checkbox" id="ai"> الذكاء الاصطناعي</label>
    </div>
    <div id="msg" class="note"></div>
    <div id="list" class="tab-body" style="padding:0"></div>
  </div>
  <script type="module" src="taskpane.js"></script>
</body>
</html>
